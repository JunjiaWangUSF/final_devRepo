apiVersion: v1
kind: Service
metadata:
  name: authorization-service-${COLOR}
  namespace: ${NAMESPACE}
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: "/api/auth/health"
spec:
  selector:
    app: authorization-${COLOR}
    color: ${COLOR}
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
