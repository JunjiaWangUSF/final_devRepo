apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ${NAMESPACE} # e.g., uat or prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
      color: blue
  template:
    metadata:
      labels:
        app: backend
        color: blue
    spec:
      containers:
        - name: backend
          image: ${IMAGE}
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: rc1
            - name: DB_HOST
              value: database-1.cgpam6asi9ot.us-east-1.rds.amazonaws.com
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: admin
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-password-secret
                  key: password
            - name: DB_DATABASE
              value: weightTracker
