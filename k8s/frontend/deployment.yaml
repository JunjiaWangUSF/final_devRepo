apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-${COLOR}-${VERSION}
  namespace: ${NAMESPACE}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-${COLOR}
      color: ${COLOR}
      version: ${VERSION}
  template:
    metadata:
      labels:
        app: frontend-${COLOR}
        color: ${COLOR}
        version: ${VERSION}
    spec:
      containers:
        - name: frontend
          image: ${IMAGE}
          ports:
            - containerPort: 3000
