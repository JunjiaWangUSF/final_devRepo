apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp-ingress-blue
  namespace: ${NAMESPACE}
  annotations:
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:164237789350:certificate/09700a04-b72a-4efd-a600-c38ba793b022"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
spec:
  ingressClassName: alb
  rules:
    - host: ${NAMESPACE}-blue.junjiawangusf.live
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: authorization-service-${COLOR}-${VERSION}
                port:
                  number: 8001
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service-${COLOR}-${VERSION}
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service-${COLOR}-${VERSION}
                port:
                  number: 3000
