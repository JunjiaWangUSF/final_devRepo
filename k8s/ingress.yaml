apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: uat
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
          - path: /login
            pathType: Exact
            backend:
              service:
                name: authorization-service
                port:
                  number: 8001
          - path: /register
            pathType: Exact
            backend:
              service:
                name: authorization-service
                port:
                  number: 8001
          - path: /weight
            pathType: Exact
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /weights(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: authorization-service
                port:
                  number: 8001
