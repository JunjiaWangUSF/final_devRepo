apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp-ingress
  namespace: uat
  annotations:
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:164237789350:certificate/09700a04-b72a-4efd-a600-c38ba793b022"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"

    # Health checks (per service)
    alb.ingress.kubernetes.io/healthcheck-path.frontend-service: "/"
    alb.ingress.kubernetes.io/healthcheck-path.backend-service: "/api/health"
    alb.ingress.kubernetes.io/healthcheck-path.authorization-service: "/api/auth/health"

    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
spec:
  ingressClassName: alb
  rules:
    - host: uat-blue.junjiawangusf.live
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: authorization-service
                port:
                  number: 8001
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
