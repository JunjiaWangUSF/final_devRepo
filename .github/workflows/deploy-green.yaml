name: Deploy Green Stack

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "version.yaml"

jobs:
  check-launch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.launch-check.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install yq
        run: sudo apt-get update && sudo apt-get install -y yq

      - name: Check launch flag
        id: launch-check
        run: |
          LAUNCH=$(yq -r '.launch' version.yaml)
          if [[ "$LAUNCH" == "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-green:
    needs: check-launch
    if: needs.check-launch.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install kubectl and yq
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          sudo apt-get update && sudo apt-get install -y yq

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region us-east-1 --name dev-eks-blue-green

      - name: Read deployment values from version.yaml
        id: version
        run: |
          echo "namespace=$(yq -r '.namespace' version.yaml)" >> "$GITHUB_OUTPUT"
          echo "authorization_image=$(yq -r '.authorization_image' version.yaml)" >> "$GITHUB_OUTPUT"
          echo "backend_image=$(yq -r '.backend_image' version.yaml)" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$(yq -r '.frontend_image' version.yaml)" >> "$GITHUB_OUTPUT"
          echo "switch_traffic=$(yq -r '.switch_traffic' version.yaml)" >> "$GITHUB_OUTPUT"

      - name: Deploy Green
        run: |
          make deploy-${{ steps.version.outputs.namespace }}-green \
            AUTHORIZATION_IMAGE=${{ steps.version.outputs.authorization_image }} \
            BACKEND_IMAGE=${{ steps.version.outputs.backend_image }} \
            FRONTEND_IMAGE=${{ steps.version.outputs.frontend_image }} \
            NAMESPACE=${{ steps.version.outputs.namespace }}

      - name: Shift traffic to green if enabled
        if: ${{ steps.version.outputs.switch_traffic == 'true' }}
        run: |
          make shift-traffic-${{ steps.version.outputs.namespace }}
